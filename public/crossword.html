<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Mini Crossword</title>
<style>
  :root{
    --bg:#eef0f7; --bg2:#ece7f4; --card:#ffffff; --ink:#28262f; --sub:#726e7c;
    --line:#e9e3f0; --green:#37a065; --greenDk:#2c7d50; --teal:#2f9e93; --blue:#3f6faf;
    --sel:#d8efe1; --word:#eaf5ef; --bad:#f6d6d6;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; min-height:100%; background:linear-gradient(160deg,var(--bg2),var(--bg)); }
  body{ font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; color:var(--ink);
    display:flex; flex-direction:column; align-items:center; padding:16px 12px 28px; min-height:100vh; }
  .wrap{ width:100%; max-width:440px; }
  .head{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:4px; }
  h1{ font-size:20px; margin:0; font-weight:800; letter-spacing:-0.3px; }
  h1 span{ color:var(--green); }
  .tagline{ font-size:11.5px; color:var(--sub); margin:2px 0 12px; }
  .bar{ display:flex; align-items:center; gap:8px; margin-bottom:12px; flex-wrap:wrap; }
  .stat{ font-size:12px; color:var(--sub); background:var(--card); border:1px solid var(--line);
    border-radius:999px; padding:5px 12px; font-variant-numeric:tabular-nums; }
  .stat b{ color:var(--ink); font-weight:700; }
  .spacer{ flex:1; }
  button.act{ font-family:inherit; font-size:12.5px; font-weight:700; cursor:pointer; border-radius:999px;
    padding:7px 14px; border:1px solid var(--green); background:var(--card); color:var(--greenDk); }
  button.act:active{ transform:translateY(1px); }
  button.act.solid{ background:var(--green); color:#fff; border-color:var(--green); }
  button.act.ghost{ border-color:var(--line); color:var(--sub); }

  .gridwrap{ display:flex; justify-content:center; margin:2px 0 10px; }
  table.grid{ border-collapse:collapse; background:var(--ink); border:3px solid var(--ink); border-radius:6px; overflow:hidden; }
  table.grid td{ width:58px; height:58px; padding:0; position:relative; background:var(--card);
    border:1px solid #cfc9db; text-align:center; vertical-align:middle; }
  @media (max-width:420px){ table.grid td{ width:17vw; height:17vw; } }
  td.sel{ background:var(--sel) !important; }
  td.word{ background:var(--word); }
  td.bad input{ color:#c0392b; }
  td .num{ position:absolute; top:1px; left:3px; font-size:9px; color:var(--sub); font-weight:600; line-height:1; }
  td input{ width:100%; height:100%; border:0; background:transparent; text-align:center;
    font-family:inherit; font-size:24px; font-weight:700; color:var(--ink); text-transform:uppercase;
    caret-color:transparent; outline:none; padding:0; }
  td input:focus{ outline:none; }

  .clues{ display:flex; gap:14px; margin-top:6px; }
  .col{ flex:1; min-width:0; }
  .col h3{ font-size:12px; margin:0 0 6px; color:var(--green); letter-spacing:0.4px; text-transform:uppercase; }
  .clue{ font-size:12.5px; line-height:1.35; color:var(--ink); padding:5px 7px; border-radius:7px; cursor:pointer;
    display:flex; gap:6px; }
  .clue .n{ color:var(--sub); font-weight:700; min-width:16px; }
  .clue.active{ background:var(--word); }
  .clue.active .n{ color:var(--greenDk); }

  .msg{ text-align:center; font-size:13px; color:var(--greenDk); font-weight:700; min-height:18px; margin-top:12px; }
  .msg.win{ font-size:15px; }
  .foot{ text-align:center; font-size:10.5px; color:var(--sub); margin-top:16px; opacity:0.8; }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>Mini <span>Crossword</span></h1>
  </div>
  <div class="tagline">Every row and column is a word. Tap a square, then type.</div>

  <div class="bar">
    <div class="stat">Time <b id="timer">0:00</b></div>
    <div class="stat" id="bestStat" style="display:none;">Best <b id="best">—</b></div>
    <div class="spacer"></div>
    <button class="act ghost" id="btnCheck">Check</button>
    <button class="act ghost" id="btnReveal">Reveal</button>
    <button class="act solid" id="btnNew">New</button>
  </div>

  <div class="gridwrap"><table class="grid" id="grid"></table></div>

  <div class="clues">
    <div class="col"><h3>Across</h3><div id="acrossList"></div></div>
    <div class="col"><h3>Down</h3><div id="downList"></div></div>
  </div>

  <div class="msg" id="msg"></div>
  <div class="foot">The Resilience Hub · Games &amp; Puzzles</div>
</div>

<script>
(function(){
"use strict";

/* ---- Resilience Hub best-time bridge (saves your best time per user) ---- */
var rhBest=null, rhReported=false;
function rhInFrame(){ try{ return window.parent && window.parent!==window; }catch(e){ return false; } }
function rhReport(sec){ if(!rhInFrame()) return; try{ window.parent.postMessage({type:'rh-score',game:'crossword',value:sec,mode:'low'},'*'); }catch(e){} }
function rhAskBest(){ try{ if(rhInFrame()) window.parent.postMessage({type:'rh-get-best',game:'crossword'},'*'); }catch(e){} }
window.addEventListener('message',function(e){
  var d=e.data; if(d && d.type==='rh-best' && d.game==='crossword' && typeof d.best==='number'){ rhBest=d.best; showBest(); }
});
function fmt(s){ s=Math.max(0,Math.round(s)); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }
function showBest(){ if(rhBest!==null){ document.getElementById('bestStat').style.display=''; document.getElementById('best').textContent=fmt(rhBest); } }
rhAskBest();

/* ---- puzzles: each row & column is a real word (verified) ---- */
var PUZZLES=[
  { grid:["CHEAT","HELLO","ELBOW","ALONE","POWER"],
    across:{1:"Break the rules of a game",6:"Friendly greeting",7:"Joint in the middle of your arm",8:"By yourself",9:"Electricity, or great strength"},
    down:{1:"Not expensive",2:"What you say answering the phone",3:"You bend your arm here",4:"On your own",5:"Tall, narrow building"} },
  { grid:["CHEST","RANCH","UTTER","SCENE","THREW"],
    across:{1:"Treasure box, or part of the body",6:"Large farm for cattle",7:"Complete; or to say aloud",8:"Part of a play, or a view",9:"Tossed a ball (past tense)"},
    down:{1:"Outer edge of a loaf of bread",2:"Break out of an egg",3:"Go in; or the big keyboard key",4:"Where an event takes place",5:"Hurled (past tense)"} },
  { grid:["CRUST","HATCH","ENTER","SCENE","THREE"],
    across:{1:"Pizza's outer edge",6:"What a chick does to leave its egg",7:"Key you press for a new line",8:"A single part of a movie",9:"The number after two"},
    down:{1:"Where your heart and lungs are",2:"A cattle farm",3:"To speak, or 'total'",4:"A place where something happens",5:"One more than two"} }
];

var SIZE=5;
var puzIdx=Math.floor(Math.random()*PUZZLES.length);
var puz, sol, num, acrossStart, downStart, cells, sel={r:0,c:0}, dir='across';
var startTime=0, timerId=null, solved=false;

function buildNumbers(){
  // full 5x5 (no black squares): across starts at col0, down starts at row0
  num={}; acrossStart={}; downStart={};
  var n=1, map={};
  for(var r=0;r<SIZE;r++){
    for(var c=0;c<SIZE;c++){
      var startA=(c===0), startD=(r===0);
      if(startA||startD){ map[r+'_'+c]=n; if(startA) acrossStart[n]={r:r,c:c}; if(startD) downStart[n]={r:r,c:c}; n++; }
    }
  }
  num=map;
}

function loadPuzzle(i){
  puz=PUZZLES[i]; sol=puz.grid.map(function(row){return row.split('');});
  buildNumbers();
  solved=false; sel={r:0,c:0}; dir='across';
  renderGrid(); renderClues(); updateHighlight();
  document.getElementById('msg').textContent=''; document.getElementById('msg').className='msg';
  startTime=Date.now(); if(timerId) clearInterval(timerId);
  timerId=setInterval(tick,1000); tick();
}
function tick(){ document.getElementById('timer').textContent=fmt((Date.now()-startTime)/1000); }

function renderGrid(){
  var t=document.getElementById('grid'); t.innerHTML=''; cells=[];
  for(var r=0;r<SIZE;r++){
    var tr=document.createElement('tr'); var rowCells=[];
    for(var c=0;c<SIZE;c++){
      var td=document.createElement('td');
      var key=r+'_'+c;
      if(num[key]){ var s=document.createElement('div'); s.className='num'; s.textContent=num[key]; td.appendChild(s); }
      var inp=document.createElement('input');
      inp.type='text'; inp.maxLength=1; inp.autocapitalize='characters'; inp.autocomplete='off';
      inp.setAttribute('inputmode','latin'); inp.dataset.r=r; inp.dataset.c=c;
      (function(r,c,inp){
        inp.addEventListener('focus',function(){ setSel(r,c,false); });
        inp.addEventListener('mousedown',function(){ if(sel.r===r&&sel.c===c) toggleDir(); });
        inp.addEventListener('input',function(e){ onType(r,c,inp); });
        inp.addEventListener('keydown',function(e){ onKey(r,c,e); });
      })(r,c,inp);
      td.appendChild(inp); tr.appendChild(td); rowCells.push({td:td,inp:inp});
    }
    t.appendChild(tr); cells.push(rowCells);
  }
}

function renderClues(){
  var aL=document.getElementById('acrossList'), dL=document.getElementById('downList');
  aL.innerHTML=''; dL.innerHTML='';
  Object.keys(puz.across).map(Number).sort(function(a,b){return a-b;}).forEach(function(n){
    aL.appendChild(clueEl(n,puz.across[n],'across'));
  });
  Object.keys(puz.down).map(Number).sort(function(a,b){return a-b;}).forEach(function(n){
    dL.appendChild(clueEl(n,puz.down[n],'down'));
  });
}
function clueEl(n,text,d){
  var el=document.createElement('div'); el.className='clue'; el.dataset.n=n; el.dataset.dir=d;
  el.innerHTML='<span class="n">'+n+'</span><span>'+text+'</span>';
  el.addEventListener('click',function(){
    var st=(d==='across')?acrossStart[n]:downStart[n];
    if(st){ dir=d; setSel(st.r,st.c,true); }
  });
  return el;
}

function wordCells(r,c,d){
  var out=[];
  if(d==='across'){ for(var cc=0;cc<SIZE;cc++) out.push({r:r,c:cc}); }
  else { for(var rr=0;rr<SIZE;rr++) out.push({r:rr,c:c}); }
  return out;
}
function currentNum(){
  if(dir==='across') return num[sel.r+'_0'];
  return num['0_'+sel.c];
}
function updateHighlight(){
  var wc=wordCells(sel.r,sel.c,dir);
  var inWord={}; wc.forEach(function(p){ inWord[p.r+'_'+p.c]=true; });
  for(var r=0;r<SIZE;r++)for(var c=0;c<SIZE;c++){
    var td=cells[r][c].td; td.classList.remove('sel','word');
    if(inWord[r+'_'+c]) td.classList.add('word');
  }
  cells[sel.r][sel.c].td.classList.add('sel');
  var cn=currentNum();
  document.querySelectorAll('.clue').forEach(function(el){
    el.classList.toggle('active', Number(el.dataset.n)===cn && el.dataset.dir===dir);
  });
}
function setSel(r,c,focus){
  sel={r:r,c:c};
  updateHighlight();
  if(focus!==false){ var inp=cells[r][c].inp; if(document.activeElement!==inp) inp.focus(); }
}
function toggleDir(){ dir=(dir==='across')?'down':'across'; updateHighlight(); }

function nextCell(r,c){
  if(dir==='across'){ if(c<SIZE-1) return {r:r,c:c+1}; }
  else { if(r<SIZE-1) return {r:r+1,c:c}; }
  return null;
}
function prevCell(r,c){
  if(dir==='across'){ if(c>0) return {r:r,c:c-1}; }
  else { if(r>0) return {r:r-1,c:c}; }
  return null;
}
function onType(r,c,inp){
  var v=(inp.value||'').toUpperCase().replace(/[^A-Z]/g,'');
  inp.value=v.slice(-1);
  cells[r][c].td.classList.remove('bad');
  if(inp.value){ var nx=nextCell(r,c); if(nx) setSel(nx.r,nx.c,true); }
  checkSolved();
}
function onKey(r,c,e){
  var k=e.key;
  if(k==='Backspace'){
    if(!cells[r][c].inp.value){ var pv=prevCell(r,c); if(pv){ cells[pv.r][pv.c].inp.value=''; setSel(pv.r,pv.c,true); e.preventDefault(); } }
    cells[r][c].td.classList.remove('bad');
  } else if(k==='ArrowRight'){ e.preventDefault(); dir='across'; if(c<SIZE-1) setSel(r,c+1,true); else updateHighlight(); }
  else if(k==='ArrowLeft'){ e.preventDefault(); dir='across'; if(c>0) setSel(r,c-1,true); else updateHighlight(); }
  else if(k==='ArrowDown'){ e.preventDefault(); dir='down'; if(r<SIZE-1) setSel(r+1,c,true); else updateHighlight(); }
  else if(k==='ArrowUp'){ e.preventDefault(); dir='down'; if(r>0) setSel(r-1,c,true); else updateHighlight(); }
  else if(k===' '){ e.preventDefault(); toggleDir(); }
  else if(k==='Enter'){ e.preventDefault(); toggleDir(); }
}

function getVal(r,c){ return (cells[r][c].inp.value||'').toUpperCase(); }
function isFull(){
  for(var r=0;r<SIZE;r++)for(var c=0;c<SIZE;c++) if(!getVal(r,c)) return false;
  return true;
}
function checkSolved(){
  if(solved || !isFull()) return;
  for(var r=0;r<SIZE;r++)for(var c=0;c<SIZE;c++) if(getVal(r,c)!==sol[r][c]) return;
  // solved!
  solved=true; if(timerId) clearInterval(timerId);
  var secs=Math.round((Date.now()-startTime)/1000);
  var m=document.getElementById('msg'); m.className='msg win';
  m.textContent='Solved in '+fmt(secs)+'! Nice work. 🎉';
  if(rhBest===null || secs<rhBest){ rhBest=secs; showBest(); }
  rhReport(secs);
}

document.getElementById('btnCheck').addEventListener('click',function(){
  var anyWrong=false, anyFilled=false;
  for(var r=0;r<SIZE;r++)for(var c=0;c<SIZE;c++){
    var v=getVal(r,c); cells[r][c].td.classList.remove('bad');
    if(v){ anyFilled=true; if(v!==sol[r][c]){ cells[r][c].td.classList.add('bad'); anyWrong=true; } }
  }
  var m=document.getElementById('msg'); m.className='msg';
  m.textContent = !anyFilled ? 'Fill some squares first!' : (anyWrong ? 'Red squares aren\u2019t right yet.' : 'Looking good so far!');
  setTimeout(function(){ for(var r=0;r<SIZE;r++)for(var c=0;c<SIZE;c++) cells[r][c].td.classList.remove('bad'); }, 1600);
});
document.getElementById('btnReveal').addEventListener('click',function(){
  for(var r=0;r<SIZE;r++)for(var c=0;c<SIZE;c++){ cells[r][c].inp.value=sol[r][c]; cells[r][c].td.classList.remove('bad'); }
  if(timerId) clearInterval(timerId); solved=true;
  var m=document.getElementById('msg'); m.className='msg'; m.textContent='Answers revealed. Tap New for another.';
});
document.getElementById('btnNew').addEventListener('click',function(){
  puzIdx=(puzIdx+1)%PUZZLES.length; loadPuzzle(puzIdx);
});

loadPuzzle(puzIdx);
})();
</script>
</body>
</html>
