<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Neo Jack: Rogue Breakout</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Orbitron:wght@500;700;900&display=swap');

  :root{
    --red:#ff2745;
    --blue:#2fd8ff;
    --bg:#07070c;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  html, body{
    margin:0;
    min-height:100vh;
    background:radial-gradient(ellipse at top, #14060f 0%, #07050d 55%, #000 100%);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    font-family:'Orbitron', sans-serif;
    color:#fff;
    padding:12px;
    overflow-x:hidden;
    touch-action:manipulation;
  }

  #game-wrap{
    position:relative;
    width:100%;
    max-width:960px;
    border:3px solid var(--red);
    border-radius:10px;
    box-shadow:0 0 25px rgba(255,39,69,.4), inset 0 0 40px rgba(47,216,255,.08);
    background:#000;
    overflow:hidden;
  }

  canvas{
    display:block;
    width:100%;
    height:auto;
    border-radius:7px;
  }

  /* Touch controls: dedicated bar BELOW the game, never overlapping play field */
  #touch-controls{
    width:100%;
    max-width:960px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    margin-top:10px;
    padding:10px 14px;
    background:linear-gradient(90deg, rgba(255,39,69,.08), rgba(47,216,255,.08));
    border:1px solid rgba(255,39,69,.35);
    border-radius:8px;
    user-select:none;
    touch-action:none;
  }

  #dpad{ position:relative; width:132px; height:132px; flex-shrink:0; }
  .dbtn{
    position:absolute; width:46px; height:46px; border-radius:10px;
    border:2px solid rgba(47,216,255,.75);
    background:rgba(10,12,24,.65);
    color:var(--blue); font-size:18px;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 0 10px rgba(47,216,255,.25);
  }
  .dbtn:active{ background:rgba(47,216,255,.35); }
  .dbtn-up{ left:43px; top:0; }
  .dbtn-down{ left:43px; top:86px; }
  .dbtn-left{ left:0; top:43px; }
  .dbtn-right{ left:86px; top:43px; }

  #action-buttons{ position:relative; width:150px; height:132px; flex-shrink:0; }
  .abtn{
    position:absolute; border-radius:50%;
    border:2px solid rgba(255,39,69,.85);
    color:#ffe0e6; font-family:'Press Start 2P', monospace;
    display:flex; align-items:center; justify-content:center; text-align:center; line-height:1.3;
  }
  .abtn:active{ background:rgba(255,39,69,.35); }
  .abtn-shoot{
    width:58px; height:58px; left:0; top:37px;
    background:rgba(47,216,255,.18); border-color:rgba(47,216,255,.85);
    box-shadow:0 0 14px rgba(47,216,255,.3); font-size:10px; color:#dff8ff;
  }
  .abtn-jump{
    width:76px; height:76px; right:0; top:28px;
    background:rgba(255,39,69,.2); box-shadow:0 0 14px rgba(255,39,69,.35); font-size:10px;
  }

  #branding{
    width:100%; max-width:960px;
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:10px 18px; margin-top:10px;
    background:linear-gradient(90deg, rgba(255,39,69,.08), rgba(47,216,255,.08));
    border:1px solid rgba(255,39,69,.35); border-radius:8px; flex-wrap:wrap;
  }
  #branding .logo{
    font-family:'Press Start 2P', monospace; font-size:11px; color:var(--red);
    letter-spacing:1px; text-shadow:0 0 8px rgba(255,39,69,.6);
  }
  #branding .tips{ font-size:12px; color:var(--blue); opacity:.9; }
  #branding .tagline{ font-size:11px; font-style:italic; color:#cfe0ff; opacity:.85; }

  #hint{ margin-top:8px; font-size:11px; color:#7c88a8; letter-spacing:.5px; text-align:center; }
</style>
</head>
<body>

<div id="game-wrap">
  <canvas id="gameCanvas" width="960" height="600"></canvas>
</div>

<div id="touch-controls">
  <div id="dpad">
    <button id="btn-up" class="dbtn dbtn-up">▲</button>
    <button id="btn-down" class="dbtn dbtn-down">▼</button>
    <button id="btn-left" class="dbtn dbtn-left">◀</button>
    <button id="btn-right" class="dbtn dbtn-right">▶</button>
  </div>
  <div id="action-buttons">
    <button id="btn-shoot" class="abtn abtn-shoot">X<br>SHOOT</button>
    <button id="btn-jump" class="abtn abtn-jump">JUMP /<br>FLY</button>
  </div>
</div>

<div id="branding">
  <div class="logo">☠ THE RESILIENCE HUB</div>
  <div class="tips">Resilience Tips by Carlos Camacho</div>
  <div class="tagline">"You never have to walk it alone"</div>
</div>

<div id="hint">Keyboard: ARROWS move | SPACE jump / fly | X shoot &nbsp;—&nbsp; or use the buttons below</div>

<script>
/* =========================================================================
   NEO JACK: ROGUE BREAKOUT  (v4 overhaul)

   STORY: Neo Jack is no longer the defender — he's the threat. Police and
   tactical units are trying to bring him down. Collect Energy Orbs and
   take down enemies to reclaim powers you lose when you're hit.

   KEY SYSTEMS IN THIS VERSION:
   - Power STACK: Jump (permanent) -> Flight -> Finger Lasers -> Chest Core,
     unlocked one per level. Getting hit strips the most-recently-active
     power first (Core, then Laser, then Flight). Killing enemies or
     grabbing Energy Orbs fills a recovery meter that restores powers back
     in the exact order they were lost.
   - Health pool cut to a small, punishy total — hits matter a lot now.
   - Flight reworked to a gentle tap-to-hover / release-to-glide feel,
     with a low speed cap so it can never rocket off-screen.
   - Bigger level layout, far more enemies (now police/tactical units).

   Sections:
     1. Config / constants
     2. Global state
     3. Level generation
     4. Input (keyboard + on-screen touch buttons)
     5. Update logic
     6. Draw functions
     7. Main loop
   ========================================================================= */

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const W = canvas.width;
const H = canvas.height;

function roundRectPath(x, y, w, h, r){
  if(typeof r === 'number') r = { tl:r, tr:r, br:r, bl:r };
  ctx.beginPath();
  ctx.moveTo(x + r.tl, y);
  ctx.lineTo(x + w - r.tr, y);
  ctx.arcTo(x + w, y, x + w, y + r.tr, r.tr);
  ctx.lineTo(x + w, y + h - r.br);
  ctx.arcTo(x + w, y + h, x + w - r.br, y + h, r.br);
  ctx.lineTo(x + r.bl, y + h);
  ctx.arcTo(x, y + h, x, y + h - r.bl, r.bl);
  ctx.lineTo(x, y + r.tl);
  ctx.arcTo(x, y, x + r.tl, y, r.tl);
  ctx.closePath();
}

/* ------------------------------------------------------------------ *
 * 1. CONFIG
 * ------------------------------------------------------------------ */
const CFG = {
  gravity: 0.55,
  jumpForce: -11.5,
  moveSpeed: 4.6,
  maxUpSpeed: 13.5,        // safety clamp for the ground jump only
  maxDownSpeed: 9.5,

  // --- reworked flight: gentle hover, capped low, glides on release ---
  flyThrust: 0.35,
  flyMaxSpeed: 2.6,
  glideGravityMultiplier: 0.35, // while gliding, only this fraction of gravity applies

  maxFuel: 100,
  fuelDrainPerFrame: 0.6,
  fuelRegenPerFrame: 1.3,

  laserSpeed: 11.5,
  laserCooldown: 13,

  hitInvincibleFrames: 90,

  // --- much smaller, punishier health pool ---
  maxHealth: 40,
  hitDamageBase: 18,        // damage when Core power is NOT active
  hitDamageCoreActive: 10,  // Core power softens the blow
  coreHeal: 12,

  coreScore: 100,
  killScore: 60,
  levelBonus: 200,

  // --- power recovery ---
  recoveryPerKill: 20,
  recoveryPerOrb: 15,
  recoveryThreshold: 100,

  coyoteFrames: 8,
  jumpBufferFrames: 8
};

// Bigger layout: original pyramid plus extra outer/upper platforms and a
// couple of low ledges near the ground for more to jump around.
const BASE_PLATFORMS = [
  { x: 0,   y: 560, w: 960, h: 40 },
  { x: 250, y: 520, w: 120, h: 16 },
  { x: 590, y: 520, w: 120, h: 16 },
  { x: 40,  y: 480, w: 190, h: 18 },
  { x: 730, y: 480, w: 190, h: 18 },
  { x: 385, y: 410, w: 190, h: 18 },
  { x: 150, y: 340, w: 170, h: 18 },
  { x: 640, y: 340, w: 170, h: 18 },
  { x: 40,  y: 270, w: 190, h: 18 },
  { x: 730, y: 270, w: 190, h: 18 },
  { x: 385, y: 200, w: 190, h: 18 },
  { x: 150, y: 130, w: 150, h: 18 },
  { x: 640, y: 130, w: 150, h: 18 }
];

/* ------------------------------------------------------------------ *
 * 2. GLOBAL STATE
 * ------------------------------------------------------------------ */
let state = 'TITLE';
let frame = 0;
let level = 1;
let score = 0;
// --- Resilience Hub score bridge (saves best score per user via the app) ---
var rhBest = null, rhReported = false;
function rhInFrame(){ try { return window.parent && window.parent !== window; } catch(e){ return false; } }
function rhReport(){
  if(rhReported || !rhInFrame()) return; rhReported = true;
  try { window.parent.postMessage({ type:'rh-score', game:'neojack', value: score, mode:'high' }, '*'); } catch(e){}
}
window.addEventListener('message', function(e){
  var d = e.data; if(d && d.type === 'rh-best' && d.game === 'neojack' && typeof d.best === 'number') rhBest = d.best;
});
try { if(rhInFrame()) window.parent.postMessage({ type:'rh-get-best', game:'neojack' }, '*'); } catch(e){}

let platforms = [];
let cores = [];      // floating Energy Orbs
let enemies = [];
let lasers = [];
let particles = [];

let cutsceneType = null;
let cutsceneTimer = 0;
let levelCompleteTimer = 0;

let prevSpaceDown = false;
let coyoteTimer = 0;
let jumpBufferTimer = 0;

const keys = {};

const player = {
  x: 450, y: 500, w: 30, h: 42,
  vx: 0, vy: 0,
  facing: 1,
  grounded: false,
  flying: false,
  fuel: CFG.maxFuel,
  energy: CFG.maxHealth,
  lives: 3,
  invincible: 0,
  shootCooldown: 0,
  // powers ever unlocked (drives cutscenes / HUD "locked" state)
  unlockedPowers: { flight: false, laser: false, core: false },
  // powers currently usable (can be knocked out by hits, regained via recovery)
  activePowers: { flight: false, laser: false, core: false },
  // chronological queue of currently-lost powers, earliest-lost first
  lostQueue: [],
  recoveryMeter: 0
};

const POWER_COLOR = { flight: '#ffcf4d', laser: '#ff2745', core: '#2fd8ff' };

/* ------------------------------------------------------------------ *
 * 3. LEVEL GENERATION
 * ------------------------------------------------------------------ */
function spawnLevel(n){
  platforms = BASE_PLATFORMS.map(p => ({...p}));
  cores = [];
  enemies = [];
  lasers = [];

  const coreCount = Math.min(10 + Math.floor((n - 1) / 2), 18);
  for(let i = 0; i < coreCount; i++){
    const plat = platforms[1 + Math.floor(Math.random() * (platforms.length - 1))];
    cores.push({
      x: plat.x + 20 + Math.random() * Math.max(1, plat.w - 40),
      y: plat.y - 26,
      collected: false,
      phase: Math.random() * Math.PI * 2
    });
  }

  // way more enemies than before, scaling harder with level
  const unitCount = Math.min(4 + n * 2, 16);
  for(let i = 0; i < unitCount; i++){
    const plat = platforms[1 + Math.floor(Math.random() * (platforms.length - 1))];
    const speed = (Math.random() < 0.5 ? -1 : 1) * (1 + n * 0.15);
    enemies.push({
      type: 'tactical',
      x: plat.x + 10, y: plat.y - 30, w: 28, h: 30,
      vx: speed, minX: plat.x, maxX: plat.x + plat.w - 28
    });
  }

  const droneCount = Math.min(2 + n, 10);
  for(let i = 0; i < droneCount; i++){
    const baseY = 90 + Math.random() * 340;
    enemies.push({
      type: 'drone',
      x: Math.random() * W, y: baseY, w: 34, h: 20,
      vx: (Math.random() < 0.5 ? -1 : 1) * (1.4 + n * 0.12),
      baseY, phase: Math.random() * Math.PI * 2,
      speedY: 0.03 + Math.random() * 0.02
    });
  }
}

function resetPlayerPosition(){
  player.x = W / 2 - player.w / 2;
  player.y = 500;
  player.vx = 0; player.vy = 0;
  player.grounded = false;
  player.energy = CFG.maxHealth;
  player.fuel = CFG.maxFuel;
  // a fresh life restores every power currently unlocked
  player.activePowers = { ...player.unlockedPowers };
  player.lostQueue = [];
  player.recoveryMeter = 0;
  coyoteTimer = 0;
  jumpBufferTimer = 0;
}

/* ------------------------------------------------------------------ *
 * 4. INPUT
 * ------------------------------------------------------------------ */
function handleActivate(){
  if(state === 'TITLE') startGame();
  else if(state === 'GAMEOVER') startGame();
  else if(state === 'CUTSCENE' && cutsceneTimer > 40) state = 'PLAYING';
}

document.addEventListener('keydown', e => {
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code)) e.preventDefault();
  keys[e.code] = true;
  if(e.code === 'Space') handleActivate();
});
document.addEventListener('keyup', e => { keys[e.code] = false; });

function bindTouchButton(el, code, onPress){
  const press = ev => { ev.preventDefault(); keys[code] = true; if(onPress) onPress(); };
  const release = ev => { ev.preventDefault(); keys[code] = false; };
  el.addEventListener('touchstart', press, { passive:false });
  el.addEventListener('touchend', release, { passive:false });
  el.addEventListener('touchcancel', release, { passive:false });
  el.addEventListener('mousedown', press);
  el.addEventListener('mouseup', release);
  el.addEventListener('mouseleave', release);
}

bindTouchButton(document.getElementById('btn-left'), 'ArrowLeft');
bindTouchButton(document.getElementById('btn-right'), 'ArrowRight');
bindTouchButton(document.getElementById('btn-up'), 'Space', handleActivate);
bindTouchButton(document.getElementById('btn-down'), 'ArrowDown');
bindTouchButton(document.getElementById('btn-jump'), 'Space', handleActivate);
bindTouchButton(document.getElementById('btn-shoot'), 'KeyX');

canvas.addEventListener('touchstart', e => { e.preventDefault(); handleActivate(); }, { passive:false });

function startGame(){
  level = 1;
  score = 0;
  rhReported = false;
  try { if(rhInFrame()) window.parent.postMessage({ type:'rh-get-best', game:'neojack' }, '*'); } catch(e){}
  player.lives = 3;
  player.unlockedPowers = { flight: false, laser: false, core: false };
  spawnLevel(level);
  resetPlayerPosition();
  state = 'PLAYING';
}

/* ------------------------------------------------------------------ *
 * 5. UPDATE
 * ------------------------------------------------------------------ */
function rectsOverlap(a, b){
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

function spawnParticles(x, y, color, count = 10, spread = 3){
  for(let i = 0; i < count; i++){
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * spread * 2,
      vy: (Math.random() - 0.5) * spread * 2 - 1,
      life: 30 + Math.random() * 20,
      maxLife: 50,
      color,
      size: 2 + Math.random() * 2
    });
  }
}

function updateParticles(){
  for(let i = particles.length - 1; i >= 0; i--){
    const p = particles[i];
    p.x += p.vx; p.y += p.vy;
    p.vy += 0.05;
    p.life--;
    if(p.life <= 0) particles.splice(i, 1);
  }
}

// Fills the recovery meter; when it's full, restores the earliest-lost power.
function tryRecoverPower(amount){
  if(player.lostQueue.length === 0) return;
  player.recoveryMeter += amount;
  if(player.recoveryMeter >= CFG.recoveryThreshold){
    player.recoveryMeter -= CFG.recoveryThreshold;
    const restored = player.lostQueue.shift();
    player.activePowers[restored] = true;
    spawnParticles(player.x + player.w/2, player.y + player.h/2, POWER_COLOR[restored], 26, 4);
  }
}

function updatePlayer(){
  // --- horizontal movement ---
  player.vx = 0;
  if(keys['ArrowLeft']){ player.vx = -CFG.moveSpeed; player.facing = -1; }
  if(keys['ArrowRight']){ player.vx = CFG.moveSpeed; player.facing = 1; }
  player.x += player.vx;
  player.x = Math.max(0, Math.min(W - player.w, player.x));

  // --- jump input: coyote time + jump buffering ---
  const spaceDown = !!keys['Space'];
  const spaceJustPressed = spaceDown && !prevSpaceDown;

  if(player.grounded) coyoteTimer = CFG.coyoteFrames;
  else coyoteTimer = Math.max(0, coyoteTimer - 1);

  if(spaceJustPressed) jumpBufferTimer = CFG.jumpBufferFrames;
  else jumpBufferTimer = Math.max(0, jumpBufferTimer - 1);

  player.vy += CFG.gravity;
  if(keys['ArrowDown'] && !player.grounded) player.vy += 0.6; // fast-fall

  player.flying = false;
  const flightUsable = player.unlockedPowers.flight && player.activePowers.flight;

  if(jumpBufferTimer > 0 && coyoteTimer > 0){
    // ground jump — unaffected by the flight rework, still punchy
    player.vy = CFG.jumpForce;
    player.grounded = false;
    jumpBufferTimer = 0;
    coyoteTimer = 0;
    spawnParticles(player.x + player.w/2, player.y + player.h, '#8fa4c9', 6, 1.5);
  } else if(spaceDown && !player.grounded && flightUsable && player.fuel > 0){
    // gentle hover: small thrust, low hard cap — tap-tap-tap to stay up
    player.vy -= CFG.flyThrust;
    if(player.vy < -CFG.flyMaxSpeed) player.vy = -CFG.flyMaxSpeed;
    player.fuel = Math.max(0, player.fuel - CFG.fuelDrainPerFrame);
    player.flying = true;
    if(frame % 4 === 0) spawnParticles(player.x + player.w/2, player.y + player.h, '#ff2745', 2, 1.2);
  } else if(!player.grounded && flightUsable && !spaceDown){
    // glide: cancel back part of the gravity we already applied this frame
    player.vy -= CFG.gravity * (1 - CFG.glideGravityMultiplier);
  }

  player.vy = Math.max(-CFG.maxUpSpeed, Math.min(CFG.maxDownSpeed, player.vy));
  player.y += player.vy;

  // hard safety clamp so flight can never carry Neo Jack off the top
  if(player.y < 0){ player.y = 0; player.vy = 0; }

  if(!player.flying && player.grounded){
    player.fuel = Math.min(CFG.maxFuel, player.fuel + CFG.fuelRegenPerFrame);
  }

  // --- platform collision (land on top only) ---
  let landed = false;
  const prevBottom = player.y + player.h - player.vy;
  for(const p of platforms){
    if(player.x + player.w > p.x && player.x < p.x + p.w){
      const bottom = player.y + player.h;
      if(player.vy >= 0 && prevBottom <= p.y + 2 && bottom >= p.y){
        player.y = p.y - player.h;
        player.vy = 0;
        landed = true;
      }
    }
  }
  player.grounded = landed;

  if(player.y > H + 50){ resetPlayerPosition(); }

  // --- Energy Orb collection: heals a little, feeds level completion,
  //     and feeds the power-recovery meter ---
  for(const c of cores){
    if(c.collected) continue;
    const cBox = { x: c.x - 12, y: c.y - 12, w: 24, h: 24 };
    if(rectsOverlap(player, cBox)){
      c.collected = true;
      score += CFG.coreScore;
      player.energy = Math.min(CFG.maxHealth, player.energy + CFG.coreHeal);
      tryRecoverPower(CFG.recoveryPerOrb);
      spawnParticles(c.x, c.y, '#2fd8ff', 16, 3);
    }
  }

  // --- shooting ---
  if(player.shootCooldown > 0) player.shootCooldown--;
  const laserUsable = player.unlockedPowers.laser && player.activePowers.laser;
  if(keys['KeyX'] && laserUsable && player.shootCooldown <= 0){
    lasers.push({
      x: player.x + (player.facing === 1 ? player.w : -6),
      y: player.y + 15,
      vx: CFG.laserSpeed * player.facing,
      w: 13, h: 4
    });
    player.shootCooldown = CFG.laserCooldown;
    spawnParticles(player.x + player.w/2, player.y + 15, '#ff2745', 4, 2);
  }

  if(player.invincible > 0) player.invincible--;

  prevSpaceDown = spaceDown;

  if(state === 'PLAYING' && cores.every(c => c.collected)){
    triggerLevelComplete();
  }
}

function updateEnemies(){
  for(const e of enemies){
    if(e.type === 'tactical'){
      e.x += e.vx;
      if(e.x < e.minX || e.x > e.maxX) e.vx *= -1;
    } else if(e.type === 'drone'){
      e.x += e.vx;
      if(e.x < -60) e.x = W + 60;
      if(e.x > W + 60) e.x = -60;
      e.y = e.baseY + Math.sin(frame * e.speedY + e.phase) * 40;
    }
    if(player.invincible <= 0 && rectsOverlap(player, e)){
      hitPlayer();
    }
  }
}

// Hit rules: big chunk of health always; strips whichever power was most
// recently active, in priority order Core -> Laser -> Flight.
function hitPlayer(){
  const coreActive = player.unlockedPowers.core && player.activePowers.core;
  const damage = coreActive ? CFG.hitDamageCoreActive : CFG.hitDamageBase;
  player.energy -= damage;
  player.invincible = CFG.hitInvincibleFrames;
  spawnParticles(player.x + player.w/2, player.y + player.h/2, '#ff2745', 16, 3.5);

  const priority = ['core', 'laser', 'flight'];
  for(const p of priority){
    if(player.unlockedPowers[p] && player.activePowers[p]){
      player.activePowers[p] = false;
      player.lostQueue.push(p);
      spawnParticles(player.x + player.w/2, player.y + player.h/2, POWER_COLOR[p], 14, 3);
      break;
    }
  }

  if(player.energy <= 0){
    player.lives--;
    if(player.lives <= 0){
      state = 'GAMEOVER';
      rhReport();
    } else {
      resetPlayerPosition();
    }
  }
}

function updateLasers(){
  for(let i = lasers.length - 1; i >= 0; i--){
    const l = lasers[i];
    l.x += l.vx;
    let hit = false;
    for(let j = enemies.length - 1; j >= 0; j--){
      const e = enemies[j];
      if(rectsOverlap(l, e)){
        spawnParticles(e.x + e.w/2, e.y + e.h/2, '#2fd8ff', 18, 4);
        enemies.splice(j, 1);
        score += CFG.killScore;
        tryRecoverPower(CFG.recoveryPerKill);
        hit = true;
        break;
      }
    }
    if(hit || l.x < -20 || l.x > W + 20) lasers.splice(i, 1);
  }
}

function triggerLevelComplete(){
  state = 'LEVEL_COMPLETE';
  levelCompleteTimer = 0;
  score += CFG.levelBonus * level;
}

function nextLevel(){
  level++;
  let newPower = null;
  if(level === 2 && !player.unlockedPowers.flight){
    player.unlockedPowers.flight = true; player.activePowers.flight = true; newPower = 'flight';
  } else if(level === 3 && !player.unlockedPowers.laser){
    player.unlockedPowers.laser = true; player.activePowers.laser = true; newPower = 'laser';
  } else if(level === 4 && !player.unlockedPowers.core){
    player.unlockedPowers.core = true; player.activePowers.core = true; newPower = 'core';
  }

  spawnLevel(level);
  resetPlayerPosition();

  if(newPower){
    state = 'CUTSCENE';
    cutsceneType = newPower;
    cutsceneTimer = 0;
  } else {
    state = 'PLAYING';
  }
}

function update(){
  frame++;
  updateParticles();

  if(state === 'PLAYING'){
    updatePlayer();
    updateEnemies();
    updateLasers();
  } else if(state === 'LEVEL_COMPLETE'){
    levelCompleteTimer++;
    if(levelCompleteTimer > 100) nextLevel();
  } else if(state === 'CUTSCENE'){
    cutsceneTimer++;
    if(cutsceneTimer > 220) state = 'PLAYING';
  }
}

/* ------------------------------------------------------------------ *
 * 6. DRAW
 * ------------------------------------------------------------------ */
function drawBackground(){
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#0c0614');
  g.addColorStop(0.55, '#170a1e');
  g.addColorStop(1, '#20060f');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  const glowA = ctx.createRadialGradient(190, 130, 20, 190, 130, 280);
  glowA.addColorStop(0, 'rgba(47,216,255,0.14)');
  glowA.addColorStop(1, 'rgba(47,216,255,0)');
  ctx.fillStyle = glowA;
  ctx.fillRect(0, 0, W, H);

  const glowB = ctx.createRadialGradient(800, 110, 20, 800, 110, 260);
  glowB.addColorStop(0, 'rgba(255,39,69,0.16)');
  glowB.addColorStop(1, 'rgba(255,39,69,0)');
  ctx.fillStyle = glowB;
  ctx.fillRect(0, 0, W, H);

  for(let i = 0; i < 70; i++){
    const sx = (i * 137) % W;
    const sy = (i * 91) % (H - 160);
    const tw = (Math.sin(frame * 0.03 + i) + 1) / 2;
    ctx.globalAlpha = 0.25 + tw * 0.55;
    ctx.fillStyle = i % 4 === 0 ? '#2fd8ff' : '#ffffff';
    ctx.fillRect(sx, sy, 2, 2);
  }
  ctx.globalAlpha = 1;

  for(let i = 0; i < 13; i++){
    const bw = 62, bh = 44 + (i * 41) % 130;
    const bx = i * 82 - 10;
    const by = H - 40 - bh;
    const bg = ctx.createLinearGradient(bx, by, bx, by + bh);
    bg.addColorStop(0, '#241428');
    bg.addColorStop(1, '#140a18');
    ctx.fillStyle = bg;
    roundRectPath(bx, by, bw, bh, 4);
    ctx.fill();
    for(let wx = bx + 8; wx < bx + bw - 8; wx += 12){
      for(let wy = by + 8; wy < by + bh - 8; wy += 14){
        const lit = (Math.floor(frame / 40) + wx + wy) % 9 === 0;
        ctx.fillStyle = lit ? 'rgba(255,39,69,0.85)' : 'rgba(120,120,160,0.12)';
        ctx.fillRect(wx, wy, 4, 6);
      }
    }
  }

  ctx.save();
  ctx.strokeStyle = 'rgba(47,216,255,0.25)';
  ctx.lineWidth = 1;
  const horizonY = H - 40;
  for(let i = -10; i <= 10; i++){
    const spread = i * 90;
    ctx.beginPath();
    ctx.moveTo(W/2, horizonY - 30);
    ctx.lineTo(W/2 + spread, horizonY);
    ctx.stroke();
  }
  ctx.restore();

  const groundGlow = ctx.createLinearGradient(0, H - 44, 0, H);
  groundGlow.addColorStop(0, 'rgba(255,39,69,0.18)');
  groundGlow.addColorStop(1, 'rgba(255,39,69,0)');
  ctx.fillStyle = groundGlow;
  ctx.fillRect(0, H - 44, W, 44);
}

function drawPlatforms(){
  for(const p of platforms){
    const body = ctx.createLinearGradient(0, p.y, 0, p.y + p.h);
    body.addColorStop(0, '#2c2536');
    body.addColorStop(1, '#17131e');
    ctx.fillStyle = body;
    roundRectPath(p.x, p.y, p.w, p.h, 6);
    ctx.fill();

    ctx.save();
    const edgeColor = (Math.floor(p.x / 90) % 2 === 0) ? '#2fd8ff' : '#ff2745';
    ctx.shadowColor = edgeColor;
    ctx.shadowBlur = 9;
    ctx.fillStyle = edgeColor;
    roundRectPath(p.x + 3, p.y, p.w - 6, 3, 2);
    ctx.fill();
    ctx.restore();

    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    for(let vx = p.x + 14; vx < p.x + p.w - 10; vx += 26){
      ctx.beginPath();
      ctx.arc(vx, p.y + p.h - 6, 2, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

function drawCores(){
  for(const c of cores){
    if(c.collected) continue;
    const bob = Math.sin(frame * 0.08 + c.phase) * 4;
    const pulse = (Math.sin(frame * 0.15 + c.phase) + 1) / 2;
    ctx.save();
    ctx.translate(c.x, c.y + bob);
    ctx.strokeStyle = `rgba(47,216,255,${0.3 + pulse * 0.3})`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, 0, 14 + pulse * 3, 0, Math.PI * 2);
    ctx.stroke();
    const grad = ctx.createRadialGradient(-2, -2, 1, 0, 0, 10);
    grad.addColorStop(0, '#e8fbff');
    grad.addColorStop(0.5, '#2fd8ff');
    grad.addColorStop(1, '#0f7fa3');
    ctx.shadowColor = '#2fd8ff';
    ctx.shadowBlur = 10 + pulse * 8;
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(0, 0, 9, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

function drawEnemies(){
  for(const e of enemies){
    if(e.type === 'tactical'){
      ctx.save();
      // dark navy tactical/police unit
      const body = ctx.createLinearGradient(e.x, e.y, e.x, e.y + e.h);
      body.addColorStop(0, '#3a4a72');
      body.addColorStop(1, '#151c30');
      ctx.fillStyle = body;
      roundRectPath(e.x, e.y, e.w, e.h, 6);
      ctx.fill();
      ctx.strokeStyle = '#0a0e1a';
      ctx.lineWidth = 1.5;
      roundRectPath(e.x, e.y, e.w, e.h, 6);
      ctx.stroke();

      ctx.fillStyle = '#0e1220';
      roundRectPath(e.x - 2, e.y + e.h - 6, e.w + 4, 8, 3);
      ctx.fill();

      // badge
      ctx.fillStyle = '#ffcf4d';
      ctx.beginPath();
      ctx.arc(e.x + e.w/2, e.y + e.h - 12, 2.2, 0, Math.PI * 2);
      ctx.fill();

      // visor / eye
      const eyeX = e.x + (e.vx > 0 ? e.w - 9 : 5);
      ctx.shadowColor = '#2fd8ff';
      ctx.shadowBlur = 8;
      ctx.fillStyle = '#2fd8ff';
      ctx.beginPath();
      ctx.arc(eyeX, e.y + 11, 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;

      ctx.strokeStyle = '#3a4a72';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(e.x + e.w/2, e.y);
      ctx.lineTo(e.x + e.w/2, e.y - 7);
      ctx.stroke();
      ctx.fillStyle = '#ff2745';
      ctx.beginPath();
      ctx.arc(e.x + e.w/2, e.y - 8, 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    } else {
      // police cruiser drone: dark body, red/blue alternating siren bar
      ctx.save();
      const grad = ctx.createLinearGradient(e.x, e.y, e.x, e.y + e.h);
      grad.addColorStop(0, '#c9ccd6');
      grad.addColorStop(1, '#2a2d38');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.ellipse(e.x + e.w/2, e.y + e.h/2, e.w/2, e.h/2, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#101218';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      ctx.fillStyle = 'rgba(10,10,15,0.5)';
      ctx.beginPath();
      ctx.ellipse(e.x + e.w/2, e.y + e.h/2 + 2, e.w/2 - 6, e.h/2 - 6, 0, 0, Math.PI * 2);
      ctx.fill();

      // fast-blinking siren bar
      const sirenOn = Math.floor(frame / 5) % 2 === 0;
      const c1 = sirenOn ? '#ff2745' : '#2fd8ff';
      const c2 = sirenOn ? '#2fd8ff' : '#ff2745';
      ctx.shadowBlur = 8;
      ctx.shadowColor = c1;
      ctx.fillStyle = c1;
      ctx.beginPath(); ctx.arc(e.x + e.w/2 - 5, e.y + 1, 2.6, 0, Math.PI * 2); ctx.fill();
      ctx.shadowColor = c2;
      ctx.fillStyle = c2;
      ctx.beginPath(); ctx.arc(e.x + e.w/2 + 5, e.y + 1, 2.6, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
  }
}

function drawLasers(){
  for(const l of lasers){
    ctx.save();
    ctx.shadowColor = '#ff2745';
    ctx.shadowBlur = 10;
    const g = ctx.createLinearGradient(l.x, l.y, l.x + l.w, l.y);
    g.addColorStop(0, 'rgba(255,39,69,0.2)');
    g.addColorStop(0.5, '#ff9aa8');
    g.addColorStop(1, 'rgba(255,39,69,0.2)');
    ctx.fillStyle = g;
    roundRectPath(l.x, l.y, l.w, l.h, 2);
    ctx.fill();
    ctx.restore();
  }
}

function drawParticles(){
  for(const p of particles){
    ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size/2, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

/* --------------------------------------------------------------------
   NEO JACK — original, corrupted-hero design. Dark gunmetal plating,
   glowing red eyes, sharp claws, permanently cracked chest plate.
   The glow inside the crack, the claws, and the boot flame each react
   to whether that power is currently active, lost, or not yet unlocked.
   -------------------------------------------------------------------- */
function drawPlayer(px, py, opts = {}){
  const facing = opts.facing !== undefined ? opts.facing : player.facing;
  const flying = opts.flying !== undefined ? opts.flying : player.flying;
  const chestPulse = opts.chestPulse !== undefined ? opts.chestPulse : 0.6 + Math.sin(frame * 0.1) * 0.4;
  const showLaserGlow = opts.laserGlow || false;

  const coreUnlocked = opts.coreUnlocked !== undefined ? opts.coreUnlocked : player.unlockedPowers.core;
  const coreActiveNow = opts.coreActive !== undefined ? opts.coreActive : player.activePowers.core;
  const laserUnlocked = opts.laserUnlocked !== undefined ? opts.laserUnlocked : player.unlockedPowers.laser;
  const laserActiveNow = opts.laserActive !== undefined ? opts.laserActive : player.activePowers.laser;
  const flightUnlocked = opts.flightUnlocked !== undefined ? opts.flightUnlocked : player.unlockedPowers.flight;

  if(player.invincible > 0 && Math.floor(frame / 4) % 2 === 0 && !opts.cutscene) return;

  ctx.save();
  ctx.translate(px, py);
  if(facing === -1){ ctx.scale(-1, 1); ctx.translate(-30, 0); }

  // ---- jet flame while actively flying ----
  if(flightUnlocked && flying){
    ctx.save();
    ctx.shadowColor = '#ff2745';
    ctx.shadowBlur = 16;
    const flame = ctx.createLinearGradient(0, 40, 0, 58);
    flame.addColorStop(0, 'rgba(255,255,255,0.95)');
    flame.addColorStop(0.35, 'rgba(255,39,69,0.9)');
    flame.addColorStop(1, 'rgba(47,216,255,0)');
    ctx.fillStyle = flame;
    const flick = Math.random() * 4;
    ctx.beginPath(); ctx.moveTo(3, 40); ctx.lineTo(1, 46 + flick); ctx.lineTo(9, 40); ctx.fill();
    ctx.beginPath(); ctx.moveTo(20, 40); ctx.lineTo(28, 46 + flick); ctx.lineTo(24, 40); ctx.fill();
    ctx.restore();
  }

  const outline = '#050308';

  // ---- boots ----
  const bootGrad = ctx.createLinearGradient(0, 30, 0, 42);
  bootGrad.addColorStop(0, '#3a3542');
  bootGrad.addColorStop(1, '#17141d');
  ctx.fillStyle = bootGrad;
  ctx.strokeStyle = outline;
  ctx.lineWidth = 1.4;
  roundRectPath(2, 30, 10, 13, 3); ctx.fill(); ctx.stroke();
  roundRectPath(17, 30, 10, 13, 3); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#ff2745';
  ctx.shadowColor = '#ff2745';
  ctx.shadowBlur = 4;
  ctx.fillRect(2, 41, 10, 2.2);
  ctx.fillRect(17, 41, 10, 2.2);
  ctx.shadowBlur = 0;

  // ---- torso ----
  const torsoGrad = ctx.createLinearGradient(0, 13, 0, 33);
  torsoGrad.addColorStop(0, '#3d3746');
  torsoGrad.addColorStop(1, '#1c1922');
  ctx.fillStyle = torsoGrad;
  ctx.strokeStyle = outline;
  ctx.lineWidth = 1.4;
  roundRectPath(3, 13, 24, 20, { tl:7, tr:7, br:4, bl:4 });
  ctx.fill(); ctx.stroke();

  const trimGrad = ctx.createLinearGradient(3, 13, 27, 13);
  trimGrad.addColorStop(0, '#ff2745');
  trimGrad.addColorStop(1, '#8f0f22');
  ctx.fillStyle = trimGrad;
  roundRectPath(3, 13, 24, 4.5, { tl:7, tr:7, br:0, bl:0 });
  ctx.fill();

  // ---- cracked chest plate (always present) + core glow (state-dependent) ----
  ctx.save();
  ctx.strokeStyle = 'rgba(0,0,0,0.55)';
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(11, 20); ctx.lineTo(14, 24); ctx.lineTo(12, 27);
  ctx.lineTo(19, 30); ctx.lineTo(21, 26); ctx.lineTo(18, 22); ctx.lineTo(20, 18);
  ctx.stroke();

  if(coreUnlocked && coreActiveNow){
    const coreGrad = ctx.createRadialGradient(15, 24, 0.5, 15, 24, 6);
    coreGrad.addColorStop(0, '#ffffff');
    coreGrad.addColorStop(0.45, `rgba(47,216,255,${0.75 + chestPulse * 0.25})`);
    coreGrad.addColorStop(1, `rgba(255,39,69,${0.15 + chestPulse * 0.2})`);
    ctx.shadowColor = '#2fd8ff';
    ctx.shadowBlur = 8 + chestPulse * 12;
    ctx.fillStyle = coreGrad;
    ctx.beginPath();
    ctx.arc(15, 24, 4.5 + chestPulse * 1.5, 0, Math.PI * 2);
    ctx.fill();
  } else if(coreUnlocked && !coreActiveNow){
    // power lost — dim, flickering red, recoverable
    const flicker = (Math.floor(frame/8) % 3 === 0) ? 0.55 : 0.18;
    ctx.shadowColor = '#ff2745';
    ctx.shadowBlur = 5;
    ctx.fillStyle = `rgba(255,39,69,${flicker})`;
    ctx.beginPath();
    ctx.arc(15, 24, 3.6, 0, Math.PI * 2);
    ctx.fill();
  } else {
    // never unlocked yet
    ctx.fillStyle = 'rgba(60,60,75,0.6)';
    ctx.beginPath();
    ctx.arc(15, 24, 3.5, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();

  // ---- arms ----
  const armGrad = ctx.createLinearGradient(0, 16, 0, 30);
  armGrad.addColorStop(0, '#3d3746');
  armGrad.addColorStop(1, '#1c1922');
  ctx.fillStyle = armGrad;
  ctx.strokeStyle = outline;
  roundRectPath(-3, 16, 7, 14, 3); ctx.fill(); ctx.stroke();
  roundRectPath(26, 16, 7, 14, 3); ctx.fill(); ctx.stroke();

  // ---- clawed hands: color/glow reflects laser power state ----
  ctx.save();
  let clawColor, clawGlow = 0;
  if(laserUnlocked && laserActiveNow){
    const flashing = showLaserGlow || Math.floor(frame/20) % 2 === 0;
    clawColor = flashing ? '#ffb3bd' : '#cfd2dc';
    clawGlow = flashing ? 14 : 6;
    ctx.shadowColor = '#ff2745';
  } else if(laserUnlocked && !laserActiveNow){
    clawColor = '#5a4048';
    clawGlow = 0;
  } else {
    clawColor = '#cfd2dc';
    clawGlow = 0;
  }
  ctx.shadowBlur = clawGlow;
  ctx.fillStyle = clawColor;
  ctx.strokeStyle = outline;
  ctx.lineWidth = 1;
  [0.5, 29.5].forEach(handX => {
    ctx.beginPath();
    ctx.arc(handX, 31, 3, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();
    for(let k = -1; k <= 1; k++){
      ctx.beginPath();
      ctx.moveTo(handX + k * 2.2, 31);
      ctx.lineTo(handX + k * 3.4, 37 + Math.abs(k));
      ctx.lineTo(handX + k * 1.1, 31.5);
      ctx.closePath();
      ctx.fill();
    }
  });
  ctx.restore();

  // ---- head ----
  const headGrad = ctx.createRadialGradient(11, 4, 2, 15, 7, 11);
  headGrad.addColorStop(0, '#4a4454');
  headGrad.addColorStop(1, '#211d29');
  ctx.fillStyle = headGrad;
  ctx.strokeStyle = outline;
  ctx.lineWidth = 1.4;
  ctx.beginPath();
  ctx.arc(15, 7, 10, 0, Math.PI * 2);
  ctx.fill(); ctx.stroke();

  ctx.fillStyle = '#17141d';
  ctx.beginPath();
  ctx.moveTo(7, 10); ctx.lineTo(15, 16); ctx.lineTo(23, 10);
  ctx.lineTo(20, 8); ctx.lineTo(15, 10); ctx.lineTo(10, 8);
  ctx.closePath();
  ctx.fill();

  ctx.save();
  ctx.shadowColor = '#ff2745';
  ctx.shadowBlur = 8;
  ctx.fillStyle = '#ff2745';
  roundRectPath(11.5, 5, 5, 2.4, 1.2); ctx.fill();
  roundRectPath(18.5, 5, 5, 2.4, 1.2); ctx.fill();
  ctx.fillStyle = '#ffe0e4';
  ctx.fillRect(15.5, 5.4, 1.4, 1.4);
  ctx.restore();

  ctx.strokeStyle = '#3d3746';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(15, -3);
  ctx.lineTo(17, -8);
  ctx.lineTo(14, -10);
  ctx.stroke();
  if(Math.floor(frame / 6) % 2 === 0){
    ctx.fillStyle = '#2fd8ff';
    ctx.shadowColor = '#2fd8ff';
    ctx.shadowBlur = 6;
    ctx.beginPath();
    ctx.arc(14, -10, 1.6, 0, Math.PI * 2);
    ctx.fill();
  }

  // ---- protective aura, only while Core power is active ----
  if(coreUnlocked && coreActiveNow){
    ctx.save();
    ctx.strokeStyle = `rgba(47,216,255,${0.4 + Math.sin(frame*0.1)*0.15})`;
    ctx.lineWidth = 2;
    ctx.shadowColor = '#2fd8ff';
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.ellipse(15, 20, 24, 30, 0, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }

  ctx.restore();
}

function drawPowerStatus(x, y){
  const entries = [['flight','F'], ['laser','L'], ['core','C']];
  let cx = x;
  entries.forEach(([key, letter]) => {
    const unlocked = player.unlockedPowers[key];
    const active = player.activePowers[key];
    let color;
    if(!unlocked) color = 'rgba(255,255,255,0.15)';
    else if(active) color = POWER_COLOR[key];
    else color = (Math.floor(frame/10)%2===0) ? 'rgba(255,39,69,0.75)' : 'rgba(255,39,69,0.3)';

    ctx.fillStyle = color;
    roundRectPath(cx, y, 24, 18, 4); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.3)';
    ctx.lineWidth = 1;
    roundRectPath(cx, y, 24, 18, 4); ctx.stroke();
    ctx.fillStyle = unlocked ? '#0a0a10' : 'rgba(255,255,255,0.4)';
    ctx.font = "9px 'Press Start 2P', monospace";
    ctx.fillText(letter, cx + 7, y + 13);
    cx += 30;
  });

  if(player.lostQueue.length > 0){
    const rw = 130;
    ctx.strokeStyle = '#ff2745';
    ctx.lineWidth = 1.5;
    roundRectPath(cx + 8, y + 2, rw, 14, 3); ctx.stroke();
    const pct = player.recoveryMeter / CFG.recoveryThreshold;
    ctx.fillStyle = '#ff2745';
    roundRectPath(cx + 9, y + 3, (rw - 2) * pct, 12, 2); ctx.fill();
    ctx.fillStyle = '#ffb3bd';
    ctx.font = "8px 'Press Start 2P', monospace";
    ctx.fillText('RECOVERING', cx + 8, y - 3);
  }
}

function drawHUD(){
  ctx.fillStyle = 'rgba(5,3,10,0.5)';
  ctx.fillRect(0, 0, W, 46);

  ctx.fillStyle = '#ff2745';
  ctx.font = "14px 'Press Start 2P', monospace";
  ctx.fillText('SCORE ' + score.toString().padStart(6, '0'), 16, 26);
  ctx.fillText('LV ' + level, 780, 26);

  for(let i = 0; i < player.lives; i++){
    ctx.save();
    ctx.translate(16 + i * 24, 40);
    ctx.scale(0.5, 0.5);
    drawPlayer(0, 0, {
      facing: 1, flying: false, cutscene: true,
      coreUnlocked: player.unlockedPowers.core, coreActive: player.unlockedPowers.core,
      laserUnlocked: player.unlockedPowers.laser, laserActive: player.unlockedPowers.laser,
      flightUnlocked: player.unlockedPowers.flight
    });
    ctx.restore();
  }

  const barX = 640, barY = 14, barW = 300, barH = 14;
  ctx.strokeStyle = '#2fd8ff';
  ctx.lineWidth = 2;
  roundRectPath(barX, barY, barW, barH, 4); ctx.stroke();
  const pct = Math.max(0, player.energy) / CFG.maxHealth;
  ctx.fillStyle = pct > 0.4 ? '#2fd8ff' : '#ff2745';
  roundRectPath(barX + 2, barY + 2, (barW - 4) * pct, barH - 4, 3); ctx.fill();
  ctx.fillStyle = '#cfe0ff';
  ctx.font = "9px 'Press Start 2P', monospace";
  ctx.fillText('HEALTH', barX, barY - 4);

  if(player.unlockedPowers.flight){
    const fY = barY + 22;
    ctx.strokeStyle = '#ff2745';
    roundRectPath(barX, fY, barW, barH, 4); ctx.stroke();
    const fPct = player.fuel / 100;
    ctx.fillStyle = '#ff2745';
    roundRectPath(barX + 2, fY + 2, (barW - 4) * fPct, barH - 4, 3); ctx.fill();
    ctx.fillStyle = '#cfe0ff';
    ctx.fillText('FUEL', barX, fY - 4);
  }

  drawPowerStatus(barX, barY + 46);
}

function drawCutscene(){
  ctx.fillStyle = 'rgba(0,0,0,0.78)';
  ctx.fillRect(0, 0, W, H);

  const cx = W / 2, cy = H / 2;
  const t = cutsceneTimer;

  ctx.save();
  ctx.translate(cx - 15, cy - 55);
  ctx.scale(3, 3);

  const opts = { facing: 1, cutscene: true };
  if(cutsceneType === 'core'){
    const dropProgress = Math.min(1, t / 60);
    const sphereY = -55 + dropProgress * 78;
    drawPlayer(0, 0, { ...opts, flying:false, coreUnlocked:true, coreActive: t > 60, laserUnlocked:true, laserActive:true, flightUnlocked:true });
    if(t <= 60){
      ctx.save();
      ctx.shadowColor = '#2fd8ff';
      ctx.shadowBlur = 12;
      ctx.fillStyle = '#2fd8ff';
      ctx.beginPath();
      ctx.arc(15, sphereY, 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  } else if(cutsceneType === 'flight'){
    drawPlayer(0, 0, { ...opts, flying: t > 30 && t < 150, flightUnlocked:true, laserUnlocked:false, coreUnlocked:false });
  } else if(cutsceneType === 'laser'){
    drawPlayer(0, 0, { ...opts, flying:false, flightUnlocked:true, laserUnlocked:true, laserActive:true, laserGlow: t > 30, coreUnlocked:false });
  }
  ctx.restore();

  const titles = {
    flight: 'FLIGHT SYSTEMS UNLOCKED',
    laser: 'CLAW LASERS UNLOCKED',
    core: 'CHEST ENERGY CORE ONLINE'
  };
  const subs = {
    flight: 'Tap JUMP in mid-air to hover. Let go to glide down.',
    laser: 'Tap SHOOT to fire claw energy blasts.',
    core: 'Softens hits. Lost first if you get hit again.'
  };

  ctx.textAlign = 'center';
  ctx.fillStyle = '#ff2745';
  ctx.font = "20px 'Press Start 2P', monospace";
  ctx.shadowColor = '#ff2745';
  ctx.shadowBlur = 10;
  ctx.fillText(titles[cutsceneType], cx, cy + 140);
  ctx.shadowBlur = 0;

  ctx.fillStyle = '#cfe0ff';
  ctx.font = "13px 'Orbitron', sans-serif";
  ctx.fillText(subs[cutsceneType], cx, cy + 170);

  if(t > 40){
    ctx.globalAlpha = 0.6 + Math.sin(frame * 0.15) * 0.4;
    ctx.fillStyle = '#2fd8ff';
    ctx.font = "11px 'Press Start 2P', monospace";
    ctx.fillText('TAP / PRESS SPACE TO CONTINUE', cx, cy + 210);
    ctx.globalAlpha = 1;
  }
  ctx.textAlign = 'left';
}

function drawTitleScreen(){
  drawBackground();
  ctx.textAlign = 'center';
  ctx.fillStyle = '#ff2745';
  ctx.font = "32px 'Press Start 2P', monospace";
  ctx.shadowColor = '#ff2745';
  ctx.shadowBlur = 16;
  ctx.fillText('NEO JACK', W/2, 170);
  ctx.font = "15px 'Press Start 2P', monospace";
  ctx.fillStyle = '#2fd8ff';
  ctx.shadowColor = '#2fd8ff';
  ctx.fillText('ROGUE BREAKOUT', W/2, 202);
  ctx.shadowBlur = 0;

  drawPlayer(W/2 - 36, 250, {
    facing: 1, cutscene: true,
    coreUnlocked: true, coreActive: true, laserUnlocked: true, laserActive: true, flightUnlocked: true
  });

  ctx.fillStyle = '#cfe0ff';
  ctx.font = "11px 'Orbitron', sans-serif";
  ctx.fillText('A hero corrupted — now the city\'s greatest threat.', W/2, 380);
  ctx.fillText('Police and tactical units are closing in. Break free.', W/2, 400);
  ctx.fillText('Every hit costs you a power. Fight and collect Orbs to win it back.', W/2, 420);

  ctx.globalAlpha = 0.6 + Math.sin(frame * 0.12) * 0.4;
  ctx.fillStyle = '#ff2745';
  ctx.font = "14px 'Press Start 2P', monospace";
  ctx.fillText('TAP OR PRESS SPACE TO START', W/2, 470);
  ctx.globalAlpha = 1;

  ctx.font = "11px 'Orbitron', sans-serif";
  ctx.fillStyle = '#7c88a8';
  ctx.fillText('Keyboard: ARROWS / SPACE / X   —   Mobile: buttons below the screen', W/2, 520);
  ctx.textAlign = 'left';
}

function drawLevelComplete(){
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#ff2745';
  ctx.font = "24px 'Press Start 2P', monospace";
  ctx.shadowColor = '#ff2745';
  ctx.shadowBlur = 12;
  ctx.fillText('LEVEL ' + level + ' COMPLETE!', W/2, H/2);
  ctx.shadowBlur = 0;
  ctx.font = "13px 'Orbitron', sans-serif";
  ctx.fillStyle = '#cfe0ff';
  ctx.fillText('+' + (CFG.levelBonus * level) + ' bonus', W/2, H/2 + 30);
  ctx.textAlign = 'left';
}

function drawGameOver(){
  drawBackground();
  ctx.textAlign = 'center';
  ctx.fillStyle = '#ff2745';
  ctx.font = "28px 'Press Start 2P', monospace";
  ctx.shadowColor = '#ff2745';
  ctx.shadowBlur = 14;
  ctx.fillText('CAPTURED', W/2, 260);
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#2fd8ff';
  ctx.font = "16px 'Press Start 2P', monospace";
  ctx.fillText('SCORE ' + score, W/2, 310);
  if(rhBest !== null){
    ctx.fillStyle = '#7CFC9A';
    ctx.font = "11px 'Press Start 2P', monospace";
    ctx.fillText('BEST ' + Math.max(rhBest, score), W/2, 334);
  }
  ctx.fillStyle = '#cfe0ff';
  ctx.font = "12px 'Orbitron', sans-serif";
  ctx.fillText('You never have to walk it alone.', W/2, 366);
  ctx.globalAlpha = 0.6 + Math.sin(frame * 0.12) * 0.4;
  ctx.fillStyle = '#2fd8ff';
  ctx.font = "13px 'Press Start 2P', monospace";
  ctx.fillText('TAP OR PRESS SPACE TO RETRY', W/2, 400);
  ctx.globalAlpha = 1;
  ctx.textAlign = 'left';
}

function draw(){
  if(state === 'TITLE'){ drawTitleScreen(); return; }
  if(state === 'GAMEOVER'){ drawGameOver(); return; }

  drawBackground();
  drawPlatforms();
  drawCores();
  drawEnemies();
  drawLasers();
  drawParticles();
  drawPlayer(player.x, player.y);
  drawHUD();

  if(state === 'LEVEL_COMPLETE') drawLevelComplete();
  if(state === 'CUTSCENE') drawCutscene();
}

/* ------------------------------------------------------------------ *
 * 7. MAIN LOOP
 * ------------------------------------------------------------------ */
function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}

spawnLevel(level);
loop();
</script>
</body>
</html>
